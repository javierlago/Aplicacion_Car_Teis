[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "carteis"
version = "0.0.0.1"
description = "Desktop app to manage a taxi company: drivers, clients and invoicing."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Javier Lago Amoedo" }]
dependencies = [
    "PyQt6==6.11.0",
    "reportlab==5.0.1",
    "svglib==2.3.0",
    # Legacy .xls import/export; replaced by openpyxl in phase 3.
    "xlrd==2.0.2",
    "xlwt==1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-qt==4.5.0",
    "ruff==0.14.0",
]

# The legacy code is a flat set of top-level modules, not a package yet.
# Disable auto-discovery so `pip install -e .` only installs dependencies.
[tool.setuptools]
py-modules = []
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
qt_api = "pyqt6"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    # Generated by pyuic6 from templates/*.ui
    "MainWindow.py",
    "AcercaDeWindow.py",
    "VentanaSalir.py",
    "WindowCalendar.py",
    "docs",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
