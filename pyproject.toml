[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "carteis"
version = "0.0.0.1"
description = "Desktop app to manage a taxi company: drivers, clients and invoicing."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Javier Lago Amoedo" }]
dependencies = [
    "PyQt6==6.11.0",
    "reportlab==5.0.1",
    "svglib==2.3.0",
    # Legacy .xls import/export; replaced by openpyxl in phase 3.
    "xlrd==2.0.2",
    "xlwt==1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-cov==7.0.0",
    "pytest-qt==4.5.0",
    "ruff==0.14.0",
]

# Only the new `carteis` package is installed; the legacy top-level modules
# are run from the repo root until phase 4 removes them.
[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
include = ["carteis*"]

[tool.setuptools.package-data]
"carteis.data.migrations" = ["*.sql"]

[tool.coverage.run]
source = ["carteis"]

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
qt_api = "pyqt6"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    # Generated by pyuic6 from templates/*.ui
    "MainWindow.py",
    "AcercaDeWindow.py",
    "VentanaSalir.py",
    "WindowCalendar.py",
    "docs",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
