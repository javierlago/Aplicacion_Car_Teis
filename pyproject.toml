[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "carteis"
version = "0.0.0.1"
description = "Desktop app to manage a taxi company: drivers, clients and invoicing."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Javier Lago Amoedo" }]
dependencies = [
    "PyQt6==6.11.0",
    "openpyxl==3.1.5",
    "reportlab==5.0.1",
]

[project.optional-dependencies]
dev = [
    "pypdf==5.4.0",  # reads generated PDFs in tests
    "pytest==8.4.2",
    "pytest-cov==7.0.0",
    "pytest-qt==4.5.0",
    "ruff==0.14.0",
]
build = ["pyinstaller==6.11.1"]
docs = ["sphinx==8.2.3"]

[tool.setuptools.packages.find]
include = ["carteis*"]

[tool.setuptools.package-data]
"carteis.data.migrations" = ["*.sql"]

[tool.coverage.run]
source = ["carteis"]
omit = ["carteis/ui/generated/*", "carteis/__main__.py"]

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
qt_api = "pyqt6"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["carteis/ui/generated"]  # pyuic6 output, see tools/build_ui.py

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
